# Fader FX skin. PERFORM: the big FADER (0 = dry, right = the scene) plus each effect's
# on/off and amount; SETUP: the timing and character settings. Colours: Elektron-ish
# dark grey with an orange accent.
style=td3
theme_bg=2a2a2a
theme_panel=2a2a2a
theme_line=0c0c0c
theme_ink=ecebe6
theme_ink_dim=9a9a94
theme_ink_faint=5c5c58
theme_accent=ff7a1a
theme_accent_hi=ffa05a
theme_knob_face=3a3a3a
theme_knob_ring=050505
theme_bar=ff7a1a
theme_seg_active=ff7a1a
theme_seg_inactive=3a3a3a
theme_seg_active_tx=1a1a1a

[tab PERFORM]
frame x=36 y=88 w=1207 h=624 title="PERFORM"
toggle cx=112 cy=165 label="FILTER" key=flt_on
toggle cx=262 cy=165 label="REPEAT" key=rpt_on
toggle cx=412 cy=165 label="CRUSH" key=crush_on
toggle cx=562 cy=165 label="GATER" key=gate_on
toggle cx=712 cy=165 label="RISER" key=rise_on
toggle cx=862 cy=165 label="DROP" key=drop_on
toggle cx=1012 cy=165 label="DELAY" key=dly_on
toggle cx=1162 cy=165 label="REVERB" key=rev_on
knob cx=112 cy=300 r=34 label="LP / HP" key=flt
knob cx=262 cy=300 r=34 label="RESONANCE" key=flt_res
knob cx=412 cy=300 r=34 label="CRUSH" key=crush
knob cx=562 cy=300 r=34 label="GATE" key=gate
knob cx=712 cy=300 r=34 label="RISER" key=rise
knob cx=862 cy=300 r=34 label="DROP" key=drop
knob cx=1012 cy=300 r=34 label="DELAY" key=dly
knob cx=1162 cy=300 r=34 label="REVERB" key=rev
slider_h cx=640 cy=560 w=1000 h=60 label="FADER" key=fader
qlinks "PERFORM" = fader,flt,flt_res,crush,gate,rise,drop,dly,rev,flt_on,rpt_on,crush_on,gate_on,rise_on,drop_on,dly_on

[tab SETUP]
frame x=36 y=88 w=590 h=624 title="TIMING"
enum_h cx=331 cy=200 label="REPEAT MAX" key=rpt_div sw=110
enum_h cx=331 cy=330 label="GATE RATE" key=gate_div sw=110
enum_h cx=331 cy=460 label="DELAY TIME" key=dly_div sw=85
frame x=653 y=88 w=590 h=624 title="SPACE"
knob cx=800 cy=260 r=34 label="FEEDBACK" key=dly_fb
knob cx=1090 cy=260 r=34 label="SIZE" key=rev_size
toggle cx=945 cy=450 label="FREEZE" key=rev_freeze
qlinks "SETUP" = rpt_div,gate_div,dly_div,dly_fb,rev_size,rev_freeze,fader
qlinks_track = fader,flt,crush,gate,rise,drop,dly,rev,flt_on,rpt_on,crush_on,gate_on,rise_on,drop_on,dly_on,rev_on
