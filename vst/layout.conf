# Fader FX skin, Force-Look (1.2.0, as Rattler 1.1): large type, big touch targets, a colourful page of its own
# (gradient, glow, light rays, dark panels behind the controls), arc knobs, a big white fader cap, OFF | ON as two big
# segments. force_look.py (vst.json "skin_post") repaints the generator's images and draws the #@title / #@frame /
# #@text lines (comments for the generator); fix_slider.py (build.sh) then crops the FADER strip and paints it in the
# same look. Coordinates in shadow pixels (x 0-1280, y 86-714).
# PERFORM: each effect's OFF | ON and amount in eight columns, the FADER (0 = dry, right = the scene) below.
# SETUP: the timing, the space settings, CONTROL CH (the channel "Control In" takes CCs on; not on the Q-Links).
# Colours: night-club crimson with an orange accent (each plugin its own colours).
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=5c1224
theme_panel=5c1224
theme_box=5c1224
theme_ink=ffffff
theme_ink_dim=ffc08a
theme_accent=ff8a2a
theme_accent_hi=ffffff
theme_lcd=1a0409
theme_ink_faint=5c1224
#@look bg_top=2a0712 bg_bottom=5c1224 glow=ff5a2a ray1=ff7a3a ray2=c2185b ray_alpha=40 panel=1a0409 frame=ff8a2a frame_text=2a0712 title=ffffff sub=ffc08a text=fff1e6 knob_face=3d0d18 knob_rim=8a2a3a knob_track=4a1420 knob_arc=ff8a2a pointer=ffffff slider_track=4a1420 slider_fill=ff8a2a slider_cap=ffffff slider_cap_line=3d0d18 btn=6a1a2a btn_ring=ff8a2a btn_text=ffffff btn_down=ff8a2a btn_down_text=2a0712 seg=3d0d18 seg_ring=8a3a48 seg_text=ffe0cc seg_on=ff8a2a seg_on_ring=ffffff seg_on_text=2a0712 pill_off=3d0d18 pill_on=ff8a2a pill_dot=ffffff list=1a0409 list_ring=ff8a2a opt=3d0d18 opt_text=fff1e6 opt_on=ff8a2a opt_on_text=2a0712

[tab PERFORM]
#@title text="PERFORM" sub="FADER FX 1.2"
#@frame x=20 y=156 w=1240 h=340
#@text cx=97 cy=186 label="FILTER" size=26
#@text cx=252 cy=186 label="REPEAT" size=26
#@text cx=407 cy=186 label="CRUSH" size=26
#@text cx=562 cy=186 label="GATER" size=26
#@text cx=717 cy=186 label="RISER" size=26
#@text cx=872 cy=186 label="DROP" size=26
#@text cx=1027 cy=186 label="DELAY" size=26
#@text cx=1182 cy=186 label="REVERB" size=26
enum_h cx=97 cy=234 label="" key=flt_on sw=66 sh=56
enum_h cx=252 cy=234 label="" key=rpt_on sw=66 sh=56
enum_h cx=407 cy=234 label="" key=crush_on sw=66 sh=56
enum_h cx=562 cy=234 label="" key=gate_on sw=66 sh=56
enum_h cx=717 cy=234 label="" key=rise_on sw=66 sh=56
enum_h cx=872 cy=234 label="" key=drop_on sw=66 sh=56
enum_h cx=1027 cy=234 label="" key=dly_on sw=66 sh=56
enum_h cx=1182 cy=234 label="" key=rev_on sw=66 sh=56
knob cx=97 cy=352 r=45 label="LP / HP" key=flt
knob cx=252 cy=352 r=46 label="RESO" key=flt_res
knob cx=407 cy=352 r=46 label="CRUSH" key=crush
knob cx=562 cy=352 r=46 label="GATE" key=gate
knob cx=717 cy=352 r=46 label="RISER" key=rise
knob cx=872 cy=352 r=46 label="DROP" key=drop
knob cx=1027 cy=352 r=46 label="DELAY" key=dly
knob cx=1182 cy=352 r=46 label="REVERB" key=rev
#@frame x=20 y=512 w=1240 h=198 title="FADER"
slider_h cx=640 cy=582 w=1120 h=76 label="FADER" key=fader
qlinks "PERFORM" = fader,flt,flt_res,crush,gate,rise,drop,dly,rev,flt_on,rpt_on,crush_on,gate_on,rise_on,drop_on,dly_on

[tab SETUP]
#@title text="SETUP" sub="FADER FX 1.2"
#@frame x=20 y=156 w=760 h=554 title="TIMING"
enum_h cx=400 cy=250 label="" key=rpt_div sw=140 sh=68
#@text cx=400 cy=318 label="REPEAT MAX" size=29
enum_h cx=400 cy=420 label="" key=gate_div sw=140 sh=68
#@text cx=400 cy=488 label="GATE RATE" size=29
enum_h cx=400 cy=590 label="" key=dly_div sw=110 sh=68
#@text cx=400 cy=658 label="DELAY TIME" size=29
#@frame x=800 y=156 w=460 h=380 title="SPACE"
knob cx=915 cy=262 r=52 label="FEEDBACK" key=dly_fb
knob cx=1145 cy=262 r=52 label="SIZE" key=rev_size
enum_h cx=1030 cy=446 label="" key=rev_freeze sw=110 sh=60
#@text cx=1030 cy=506 label="FREEZE" size=29
#@frame x=800 y=552 w=460 h=158 title="MIDI"
#@text cx=930 cy=631 label="CONTROL CH" size=28
popup cx=1150 cy=631 w=180 h=68 label="" key=ctl_ch cols=3
qlinks "SETUP" = rpt_div,gate_div,dly_div,dly_fb,rev_size,rev_freeze,fader
qlinks_track = fader,flt,crush,gate,rise,drop,dly,rev,flt_on,rpt_on,crush_on,gate_on,rise_on,drop_on,dly_on,rev_on
