name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.2.1
        required: true
        default: 1.2.1
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  faderfx:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@1af05b911e8580c8c2e473a1cc10119132e06eca
    permissions:
      contents: write
    with:
      tag: fader-fx-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1af05b911e8580c8c2e473a1cc10119132e06eca
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: fader-fx
      license: MIT
      about: Octatrack-style performance effects - one fader morphs filter, repeat, crush, gater, riser, drop, delay throw and reverb freeze.
      dry_run: ${{ inputs.dry_run }}
